syntax = "proto3";
package lattice.catalog.v1;
option go_package = "github.com/latticecorp/lattice4all/ai-libs/api/lattice/catalog/v1;catalogv1";

// Native catalog management. All catalog RPCs require authorization and
// x-lattice-scope metadata; mutations also require x-request-id metadata.
service CatalogService {
  rpc CreateService(CreateServiceRequest) returns (MutationResult);
  rpc GetService(GetServiceRequest) returns (GetServiceResponse);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc ListScopes(ListScopesRequest) returns (ListScopesResponse);
  rpc UpdateService(UpdateServiceRequest) returns (MutationResult);
  rpc DeleteService(DeleteServiceRequest) returns (MutationResult);
  rpc ApplyTransaction(ApplyTransactionRequest) returns (MutationResult);
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse);
  rpc LoadWellKnown(LoadWellKnownRequest) returns (LoadWellKnownResponse);
}
message Address { string type = 1; string value = 2; }
message Capabilities {
  repeated string model_ids = 1 [json_name = "modelIDs"];
  repeated string protocols = 2;
  repeated string tool_names = 3;
}
message CredentialHeader {
  string header = 1;
  string prefix = 2;
  string secret_key = 3 [json_name = "secret_key"];
}
message ServiceInput {
  string kind = 1;
  string name = 2;
  string scope = 3;
  map<string,string> labels = 4;
  Capabilities capabilities = 5;
  repeated Address addresses = 6;
  // Optional model routing details; empty values mean unspecified.
  string type = 7;
  string protocol = 8;
  // Task-selection rubric describing suitable workloads.
  string description = 9;
  string model_name = 10;
  // API path only, e.g. /v1/chat/completions; host and port come from addresses.
  string model_endpoint = 11;
  string credential_id = 12 [json_name = "credentialID"];
  string secret_file = 13;
  repeated CredentialHeader headers = 14;
  repeated string instances = 15;
  string source_service_id = 16 [json_name = "sourceServiceID"];
  string status = 17;
  string tool_schema = 18 [json_name = "toolSchema"];
  repeated string exported_tools = 19 [json_name = "exportedTools"];
  repeated string imported_tools = 20 [json_name = "importedTools"];
}
message Service {
  string kind = 1;
  string name = 2;
  string scope = 3;
  map<string,string> labels = 4;
  Capabilities capabilities = 5;
  repeated Address addresses = 6;
  string id = 7;
  uint32 schema_version = 8;
  uint64 revision = 9;
  string origin = 10;
  string owner = 11;
  string created_at = 12;
  string updated_at = 13;
  // Optional model routing details; empty values mean unspecified.
  string type = 14;
  string protocol = 15;
  string description = 16;
  string model_name = 17;
  // API path only, e.g. /v1/chat/completions; host and port come from addresses.
  string model_endpoint = 18;
  string credential_id = 19 [json_name = "credentialID"];
  string secret_file = 20;
  repeated CredentialHeader headers = 21;
  repeated string instances = 22;
  string source_service_id = 23 [json_name = "sourceServiceID"];
  string status = 24;
  string tool_schema = 25 [json_name = "toolSchema"];
  repeated string exported_tools = 26 [json_name = "exportedTools"];
  repeated string imported_tools = 27 [json_name = "importedTools"];
}
message Operation {
  string type = 1;
  string id = 2;
  uint64 expected_revision = 3;
  ServiceInput service = 4;
  // JSON Merge Patch over editable service fields. Used only by update.
  bytes patch_json = 5;
  string instance_id = 6 [json_name = "instanceID"];
}
message ServiceError {
  string code = 1;
  string message = 2;
  int32 status = 3;
  map<string,string> details = 4;
}
message MutationResult {
  string request_id = 1 [json_name = "requestID"];
  uint64 catalog_revision = 2;
  uint64 applied_index = 3;
  repeated Service services = 4;
  repeated string deleted_ids = 5 [json_name = "deletedIDs"];
  ServiceError error = 6;
}
// stale=true means this view may lag the leader. The index/revision identify
// the captured local state; observed_at is the capture time, not a sync promise.
message ReadMetadata {
  bool stale = 1;
  uint64 catalog_revision = 2;
  uint64 applied_index = 3;
  string serving_node = 4;
  string observed_at = 5;
}
message CreateServiceRequest { ServiceInput service = 1; }
message GetServiceRequest { string id = 1; optional bool stale = 2; }
message GetServiceResponse { Service service = 1; ReadMetadata read = 2; }
message ListServicesRequest {
  optional bool stale = 1;
  string kind = 2;
  string name = 3;
  string origin = 4;
  map<string,string> labels = 5;
  uint32 limit = 6;
  string cursor = 7;
}
message ListServicesResponse {
  repeated Service items = 1;
  string next_cursor = 2;
  uint64 catalog_revision = 3;
  ReadMetadata read = 4;
}
// Scope discovery is catalog-wide; scopes select data, not authorization.
message ListScopesRequest { optional bool stale = 1; }
message ListScopesResponse { repeated string scopes = 1; ReadMetadata read = 2; }
message UpdateServiceRequest { string id = 1; uint64 expected_revision = 2; bytes patch_json = 3; }
message DeleteServiceRequest { string id = 1; uint64 expected_revision = 2; }
message ApplyTransactionRequest { repeated Operation operations = 1; }
message GetOperationRequest { string request_id = 1 [json_name = "requestID"]; optional bool stale = 2; }
message GetOperationResponse { MutationResult result = 1; ReadMetadata read = 2; }
message CheckHealthRequest { bool quorum = 1; }
message CheckHealthResponse { string status = 1; string node_id = 2 [json_name = "nodeID"]; }
message DiscoveredSkill {
  string name = 1;
  string description = 2;
  string version = 3;
  string tool_schema = 4 [json_name = "toolSchema"];
}
message LoadWellKnownRequest {
  string id = 1;
}
message LoadWellKnownResponse {
  string service_id = 1 [json_name = "serviceID"];
  string source = 2;
  repeated DiscoveredSkill skills = 3;
}
