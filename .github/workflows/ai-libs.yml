name: AI libraries

on:
  push:
    paths: ['ai-libs/**', '.github/workflows/ai-libs.yml']
  pull_request:
    paths: ['ai-libs/**', '.github/workflows/ai-libs.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-libs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ai-libs/go.mod
          cache-dependency-path: ai-libs/go.sum
      - name: Install protoc 36.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip
          echo "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - run: make tools
      - run: make check
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
